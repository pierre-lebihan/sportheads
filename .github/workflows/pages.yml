name: Validate and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust components
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default stable
      - name: Validate native core and compile WebAssembly
        run: python3 scripts/build-core.py
      - name: Validate browser source
        run: |
          node --check web/game.js
          node --check web/render.js
          node --check web/rooms.js
          node --check web/ice-diagnostics.js
          node --check web/ice-signaling.js
          node --check web/net-state.js
          node --check web/selection.js
          node --check web/players.js
          node --check web/touch-controls.js
          node --check web/balance.js
          node --check web/arena-ui.js
          node --check web/setup-ui.js
          node --test tests/*.test.mjs
      - name: Build playable match and comparison bench
        run: python3 scripts/build-pages.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
