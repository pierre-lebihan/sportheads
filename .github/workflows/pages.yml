name: Validate and deploy Pages

on:
  push:
    branches: [main]
    # Markdown is never published (build-pages.py links docs to GitHub instead).
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # A newer push to the same branch cancels this validation: only the latest
    # commit is worth testing and deploying.
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned browser test dependencies
        run: npm ci
      - name: Install Rust components
        run: |
          rust_version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$rust_version" --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - name: Validate native core and compile WebAssembly
        run: python3 scripts/build-core.py
      - name: Validate browser source
        run: |
          for file in web/*.js; do node --check "$file"; done
          npm test
      - name: Build playable match and comparison bench
        run: python3 scripts/build-pages.py
        env:
          # Public URL of the optional TURN credential service (relay/README.md).
          SPORTHEADS_TURN_URL: ${{ vars.SPORTHEADS_TURN_URL }}
      - name: Hand the built site to the browser jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  browser:
    # The same Chromium and WebKit checks as before, split across three
    # machines (groups in scripts/check-browser-ci.cjs).
    needs: build
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    concurrency:
      group: validate-${{ github.ref }}-browser-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned browser test dependencies
        run: npm ci
      - name: Fetch the built site
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (Node 24)
        with:
          name: site
          path: _site
      - name: Install Chromium and WebKit with system dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Validate the built game in real browser engines
        id: browser
        run: npm run test:browser -- --shard ${{ matrix.shard }}
      - name: Save browser logs, state and screenshots
        if: ${{ !cancelled() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: browser-report-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            browser-report/
            evidence/*.png
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [build, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # A deployment that has started always finishes; a newer one waits behind it
    # and replaces any older one still queued.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
